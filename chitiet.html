<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết – Cham Folktales AI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hieuung.css">
<style>
.ct-wrap{
    max-width:840px;
    margin:0 auto;
    padding:30px 0 60px;
}
.back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:20px;
    padding:10px 20px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    color:white;
    text-decoration:none;
    font-size:14px;
    transition:0.2s;
}
.back-btn:hover{ background:rgba(255,255,255,0.13); }

.ct-tag{
    display:inline-block;
    background:rgba(124,58,237,0.78);
    color:white;
    font-size:12px;
    padding:4px 14px;
    border-radius:20px;
    margin-bottom:14px;
    font-weight:500;
}
.ct-title{
    font-size:34px;
    font-weight:800;
    color:#f4c86b;
    margin-bottom:20px;
    line-height:1.3;
}
.ct-media{
    width:100%;
    height:340px;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:24px;
    background:linear-gradient(135deg,#1a2f5a,#2d1b4e);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.ct-media img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.ct-video-wrap{
    width:100%;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    background:#000;
    aspect-ratio:16/9;
}
.ct-video-wrap iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
}
.ct-desc p{
    color:#cbd5e1;
    font-size:16px;
    line-height:1.9;
    margin-bottom:16px;
}
.ct-facts{
    background:rgba(244,200,107,0.07);
    border:1px solid rgba(244,200,107,0.18);
    border-radius:16px;
    padding:22px 24px;
    margin-top:10px;
}
.ct-fact-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
}
.ct-fact-row:last-child{ border-bottom:none; }
.ct-fact-icon{ font-size:22px; min-width:30px; text-align:center; }
.ct-fact-label{ color:#64748b; font-size:13px; min-width:140px; }
.ct-fact-value{ color:#cbd5e1; font-size:14px; }

.ct-notfound{
    text-align:center;
    padding:80px 20px;
    color:#cbd5e1;
}

@media (max-width:768px){
    .ct-title{ font-size:24px; }
    .ct-media{ height:220px; font-size:56px; }
    .ct-desc p{ font-size:14px; }
    .ct-fact-label{ min-width:110px; font-size:12px; }
}
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="container">
<div class="ct-wrap" id="ctWrap">
    <a href="vanhoacham.html" class="back-btn">← Không Gian Văn Hóa Chăm</a>
    <!-- Nội dung sẽ được JS chèn vào đây -->
</div>
</div>

<script src="vanhoadata.js"></script>
<script>
(function(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const data = window.VANHOA_DATA && window.VANHOA_DATA[id];
    const wrap = document.getElementById('ctWrap');

    if(!data){
        wrap.insertAdjacentHTML('beforeend', `
            <div class="ct-notfound">
                <h2>Không tìm thấy nội dung 😥</h2>
                <p>Đường dẫn không hợp lệ hoặc mục này chưa có dữ liệu.</p>
            </div>
        `);
        return;
    }

    document.title = data.title + ' – Cham Folktales AI';

    // Ảnh: nếu load lỗi (chưa có file) thì hiện icon thay thế
    const mediaHTML = `
        <div class="ct-media">
            <img src="${data.image}" alt="${data.title}"
                 onerror="this.parentElement.innerHTML='${data.icon}'">
        </div>
    `;

    // Video: chỉ hiện nếu có link, không thì bỏ qua hẳn phần này
    const videoHTML = data.video ? `
        <div class="ct-video-wrap">
            <iframe src="${data.video}" title="${data.title}" allowfullscreen></iframe>
        </div>
    ` : '';

    const descHTML = data.desc.map(p => `<p>${p}</p>`).join('');

    const factsHTML = data.facts.map(f => `
        <div class="ct-fact-row">
            <span class="ct-fact-icon">${f.icon}</span>
            <span class="ct-fact-label">${f.label}</span>
            <span class="ct-fact-value">${f.value}</span>
        </div>
    `).join('');

    wrap.insertAdjacentHTML('beforeend', `
        <div class="ct-tag">${data.category}</div>
        <div class="ct-title">${data.title}</div>
        ${mediaHTML}
        ${videoHTML}
        <div class="ct-desc">${descHTML}</div>
        <div class="ct-facts">${factsHTML}</div>
    `);
})();
</script>
<script src="hieuung.js"></script>
</body>
</html>
